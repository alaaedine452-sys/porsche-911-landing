<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche 911 - Pure Performance</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">PORSCHE</div>
        <div class="nav-links">
            <a href="#">Models</a>
            <a href="#">Experience</a>
            <a href="#">Config</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <div class="hero">
        <div class="car-container" id="carContainer">
            <img id="carImage" src="https://picsum.photos/id/1015/1200/600" alt="Porsche 911">
            <div class="car-overlay">
                <h1>911</h1>
                <p>Pure Performance</p>
            </div>
        </div>

        <div class="info">
            <div class="specs">
                <div>390 km/h</div>
                <div>3.0s</div>
                <div>650 HP</div>
            </div>
            <button onclick="nextCar()">Next Model</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
